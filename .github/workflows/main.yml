name: Criar chave de assinatura (uso unico)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      REPO: ${{ github.repository }}
    steps:
      - name: Conferir o que precisa existir
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Falta o Secret SETUP_TOKEN"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Falta o Secret BACKUP_PASSPHRASE"; exit 1; }

      - name: Criar a chave e cadastrar os Secrets
        run: |
          set -e
          umask 077
          KS_PASS=$(openssl rand -hex 20)
          echo "::add-mask::$KS_PASS"
          ALIAS=asccine
          keytool -genkeypair -keystore asc-cine.keystore -storetype PKCS12 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ASC Cine, O=ASC" >/dev/null 2>&1
          base64 -w0 asc-cine.keystore | gh secret set KEYSTORE_B64 --repo "$REPO"
          printf %s "$KS_PASS" | gh secret set KEYSTORE_PASSWORD --repo "$REPO"
          printf %s "$ALIAS" | gh secret set KEY_ALIAS --repo "$REPO"
          printf %s "$KS_PASS" | gh secret set KEY_PASSWORD --repo "$REPO"
          printf 'KEY_ALIAS=%s\nKEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\n' "$ALIAS" "$KS_PASS" "$KS_PASS" > senhas.txt
          tar czf pacote.tgz asc-cine.keystore senhas.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE \
            -in pacote.tgz -out ASC-Cine-chave-backup.enc
          rm -f asc-cine.keystore senhas.txt pacote.tgz
          echo "Secrets cadastrados e copia de seguranca criada."

      - uses: actions/upload-artifact@v4
        with:
          name: ASC-Cine-chave-backup
          path: ASC-Cine-chave-backup.enc
          retention-days: 1
